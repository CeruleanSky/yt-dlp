name: Sync with upstream (selective)

on:
  schedule:
    - cron: '0 6 * * *'          # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.YT_DLP_310_FORK }}   # ← use the PAT here

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git 2>/dev/null \
            || git remote set-url upstream https://github.com/yt-dlp/yt-dlp.git
          git fetch upstream master
          git fetch origin master

      - name: Selective cherry-pick
        id: cherry
        env:
          SKIP_SHAS: "3d28cf4780fa88689fc50010d72cf2f40ce3a3b8,43a45ae37419b2a90db710c9fd06cd250ef524d3"
        run: |
          set -euo pipefail

          mapfile -t NEW_COMMITS < <(git rev-list --reverse HEAD..upstream/master)

          if [ ${#NEW_COMMITS[@]} -eq 0 ]; then
            echo "No new commits."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${#NEW_COMMITS[@]} new commit(s)."

          APPLIED=0
          SKIPPED=0

          for commit in "${NEW_COMMITS[@]}"; do
            short=$(git rev-parse --short "$commit")
            subject=$(git log -1 --pretty=format:'%s' "$commit")
            message=$(git log -1 --pretty=format:'%B' "$commit")

            # Explicit SHA skip
            if echo "$SKIP_SHAS" | grep -q "$commit"; then
              echo "SKIP (explicit SHA): $short  $subject"
              ((SKIPPED++)) || true
              continue
            fi

            touches_pyproject=false
            if git diff-tree --no-commit-id --name-only -r "$commit" | grep -qx 'pyproject.toml'; then
              touches_pyproject=true
            fi

            echo "Applying: $short  $subject"

            if [ "$touches_pyproject" = true ]; then
              # Apply without committing
              if ! git cherry-pick -n --allow-empty "$commit"; then
                echo "::error::Conflict while applying $short – $subject"
                git cherry-pick --abort || true
                exit 1
              fi

              # Discard pyproject.toml changes
              git checkout HEAD -- pyproject.toml 2>/dev/null || true
              git restore --staged --worktree pyproject.toml 2>/dev/null || true

              if git diff --cached --quiet; then
                echo "SKIP (only touched pyproject.toml or already applied): $short  $subject"
                git reset --hard HEAD
                ((SKIPPED++)) || true
                continue
              fi

              git commit -m "$message"
            else
              # Normal cherry-pick
              if ! git cherry-pick --allow-empty "$commit"; then
                # Check whether it failed because the commit is already applied (empty)
                if git status | grep -q "The previous cherry-pick is now empty"; then
                  echo "SKIP (already applied / empty): $short  $subject"
                  git cherry-pick --skip || true
                  ((SKIPPED++)) || true
                  continue
                fi

                echo "::error::Conflict on $short – $subject"
                git cherry-pick --abort || true
                exit 1
              fi
            fi

            ((APPLIED++)) || true
          done

          echo "Applied: $APPLIED   Skipped: $SKIPPED"

          if [ "$APPLIED" -gt 0 ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push if changes were applied
        if: steps.cherry.outputs.applied == 'true'
        run: |
          git push origin HEAD:master



