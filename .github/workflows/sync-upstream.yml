name: Sync with upstream (selective)

on:
  schedule:
    - cron: '0 6 * * *'          # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.YT_DLP_310_FORK }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/yt-dlp/yt-dlp.git 2>/dev/null \
            || git remote set-url upstream https://github.com/yt-dlp/yt-dlp.git
          git fetch upstream master
          git fetch origin master

      - name: Selective cherry-pick
        id: cherry
        env:
          SKIP_SHAS: "3d28cf4780fa88689fc50010d72cf2f40ce3a3b8,43a45ae37419b2a90db710c9fd06cd250ef524d3"
        run: |
          set -euo pipefail

          SYNC_POINT_FILE=".github/upstream-sync-point"
          UPSTREAM_TIP=$(git rev-parse upstream/master)

          if [ -f "$SYNC_POINT_FILE" ]; then
            LAST_SYNCED=$(cat "$SYNC_POINT_FILE" | tr -d '[:space:]')
            echo "Last sync point: $LAST_SYNCED"
            mapfile -t NEW_COMMITS < <(git rev-list --reverse "${LAST_SYNCED}..upstream/master")
          else
            echo "No previous sync point found – examining all commits not in HEAD"
            mapfile -t NEW_COMMITS < <(git rev-list --reverse HEAD..upstream/master")
          fi

          if [ ${#NEW_COMMITS[@]} -eq 0 ]; then
            echo "No new commits since last sync point."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            mkdir -p .github
            echo "$UPSTREAM_TIP" > "$SYNC_POINT_FILE"
            git add "$SYNC_POINT_FILE"
            if ! git diff --cached --quiet; then
              git commit -m "chore: update upstream sync point"
              echo "applied=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Found ${#NEW_COMMITS[@]} new commit(s) to examine."

          APPLIED=0
          SKIPPED=0

          # Helper: hard-reset to a clean state
          clean_state() {
            git cherry-pick --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
          }

          for commit in "${NEW_COMMITS[@]}"; do
            short=$(git rev-parse --short "$commit")
            subject=$(git log -1 --pretty=format:'%s' "$commit")

            # Sanitize commit message (strip upstream PR/issue refs)
            message=$(git log -1 --pretty=format:'%B' "$commit" \
              | sed -E 's/\(yt-dlp#[0-9]+\)//g' \
              | sed -E 's/\(#[0-9]+\)//g' \
              | sed -E 's/yt-dlp#[0-9]+//g' \
              | sed -E 's/#[0-9]+//g' \
              | sed -E 's/  +/ /g' \
              | sed -E 's/ +$//')

            # Explicit SHA skip
            if echo "$SKIP_SHAS" | grep -q "$commit"; then
              echo "SKIP (explicit SHA): $short  $subject"
              ((SKIPPED++)) || true
              continue
            fi

            # Does this commit touch the files we never want from upstream?
            touches_build_meta=false
            if git diff-tree --no-commit-id --name-only -r "$commit" \
                 | grep -E -q '^(pyproject\.toml|uv\.lock)$'; then
              touches_build_meta=true
            fi

            echo "Applying: $short  $subject"

            if [ "$touches_build_meta" = true ]; then
              # Apply without committing so we can drop the meta files
              set +e
              git cherry-pick -n --allow-empty "$commit"
              status=$?
              set -e

              if [ $status -ne 0 ]; then
                echo "  → conflicts while applying build-meta commit (expected) – keeping our versions of pyproject.toml / uv.lock"
              fi

              # Always force *our* versions of the two files
              git checkout HEAD -- pyproject.toml uv.lock 2>/dev/null || true
              git restore --staged --worktree pyproject.toml uv.lock 2>/dev/null || true

              # Any remaining unmerged paths? → treat as conflict and skip
              if git ls-files -u | grep -q .; then
                echo "SKIP (unresolved conflicts after meta-file restore): $short  $subject"
                clean_state
                ((SKIPPED++)) || true
                continue
              fi

              # Nothing left staged → pure meta commit (or already applied)
              if git diff --cached --quiet; then
                echo "SKIP (only touched pyproject.toml / uv.lock or already applied): $short  $subject"
                clean_state
                ((SKIPPED++)) || true
                continue
              fi

              # Commit the non-meta changes
              git commit -m "$message"
              ((APPLIED++)) || true

            else
              # Normal commit
              set +e
              git cherry-pick --allow-empty "$commit"
              status=$?
              set -e

              if [ $status -ne 0 ]; then
                # Empty / already-applied
                if [ -f .git/CHERRY_PICK_HEAD ] && git diff --quiet && git diff --cached --quiet; then
                  echo "SKIP (already applied / empty): $short  $subject"
                  git cherry-pick --skip || true
                  ((SKIPPED++)) || true
                  continue
                fi

                # Real conflict → skip instead of failing the job
                echo "SKIP (conflict): $short  $subject"
                clean_state
                ((SKIPPED++)) || true
                continue
              fi

              # Rewrite message to remove GitHub references
              git commit --amend -m "$message" --no-edit || true
              ((APPLIED++)) || true
            fi
          done

          echo "Applied: $APPLIED   Skipped: $SKIPPED"

          # Always advance the sync point
          mkdir -p .github
          echo "$UPSTREAM_TIP" > "$SYNC_POINT_FILE"
          git add "$SYNC_POINT_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore: update upstream sync point to $(git rev-parse --short $UPSTREAM_TIP)"
            ((APPLIED++)) || true
          fi

          if [ "$APPLIED" -gt 0 ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push if changes were applied
        if: steps.cherry.outputs.applied == 'true'
        run: |
          git push origin HEAD:master
